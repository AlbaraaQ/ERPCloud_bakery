name: CI
on: [push, pull_request]
jobs:
  build-test:
    runs-on: ubuntu-22.04  # pinned: Prisma 5 engine platform detection
    services:
      postgres: { image: postgres:16, env: { POSTGRES_USER: erp, POSTGRES_PASSWORD: erp, POSTGRES_DB: erpcloud_test }, ports: ['5432:5432'], options: --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 10 }
    env:
      DATABASE_URL: postgresql://erp:erp@localhost:5432/erpcloud_test?schema=public
      SESSION_SECRET: ci-secret-at-least-32-characters-long
      SEED_OWNER_PASSWORD: Ci-Strong-Pass-123!
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build -w @erpcloud/shared
      - name: prisma generate
        working-directory: apps/api
        run: |
          set +e
          out=$(npx prisma generate 2>&1); code=$?
          if [ $code -ne 0 ]; then echo "::error title=prisma-generate::$(echo "$out" | tail -c 2800 | tr '\n' '|')"; fi
          exit $code
      - run: npx prisma migrate deploy
        working-directory: apps/api
      - run: npm run typecheck -ws --if-present
      - run: npm test
      - name: create non-owner app role (RLS requires it, D-013)
        working-directory: apps/api
        run: npx prisma db execute --file prisma/app-role.sql
      - run: npm run build
      - name: production docker images build + compose validation
        run: |
          cp .env.production.example .env.production
          sed -i 's/CHANGE_ME[A-Z_]*/ci-placeholder-value-32-chars-minimum/g' .env.production
          docker compose -f docker-compose.prod.yml --env-file .env.production config -q
          docker build -f apps/api/Dockerfile -t erpcloud-api:ci .
          docker build -f apps/web/Dockerfile -t erpcloud-web:ci .
      - name: integration tests (real Postgres, as erp_app)
        env: { RUN_INTEGRATION: '1', DATABASE_URL: 'postgresql://erp_app:CHANGE_ME@localhost:5432/erpcloud_test?schema=public' }
        working-directory: apps/api
        run: |
          set +e
          npx vitest run test/ > /tmp/it.log 2>&1; code=$?
          if [ $code -ne 0 ]; then echo "::error title=integration::$(grep -E 'FAIL|Error|expected|✗|×|❯' /tmp/it.log | tail -c 2500 | tr '\n' '|')"; fi
          exit $code
